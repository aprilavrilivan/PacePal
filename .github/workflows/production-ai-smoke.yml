name: Production AI smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-ai-smoke.yml
      - package-lock.json
      - package.json
      - src/app/api/plan/route.ts
      - src/features/pacepal/gateway-error.ts
      - src/features/pacepal/gateway-planner.ts
      - src/features/pacepal/plan-api.ts

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: production-ai-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for the production deployment
        shell: bash
        run: |
          for attempt in {1..30}; do
            health="$(curl -fsS --max-time 15 https://pace-pal-eta.vercel.app/api/health || true)"
            if jq -e --arg sha "$GITHUB_SHA" '
              .status == "ok" and
              .aiProvider == "gateway" and
              .commitSha == $sha
            ' <<<"$health" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify live AI task planning
        shell: bash
        run: |
          response="$(curl -fsS --max-time 60 \
            -H 'Content-Type: application/json' \
            --data '{"title":"人工智能课程研究计划","requirements":"比较两种方法，完成资料整理、提纲、初稿和复核。","deliverable":"1500 字研究报告","deadline":"2026-12-15T18:00","priority":"high"}' \
            https://pace-pal-eta.vercel.app/api/plan)"
          jq '{fallback, fallbackReason, model, subtaskCount: (.subtasks | length)}' <<<"$response"
          jq -e '
            .fallback == false and
            .model == "nvidia/nemotron-3.5-lightning-free" and
            (.subtasks | length >= 4)
          ' <<<"$response" >/dev/null
